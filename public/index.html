<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS va CEFR natijalari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1d1d1f);
    --muted: var(--tg-theme-hint-color, #6e6e73);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --accent: var(--tg-theme-button-color, #2a78d6);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --up: #2e9d57; --down: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: var(--tg-theme-bg-color, #17181b); --fg: var(--tg-theme-text-color, #f2f2f2); --card: var(--tg-theme-secondary-bg-color, #24262b); --muted: var(--tg-theme-hint-color, #9a9ca3); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-size: 15px; background: var(--card); color: var(--fg); cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { background: var(--card); border-radius: 12px; padding: 10px; }
  .card b { display: block; font-size: 20px; }
  .card span { color: var(--muted); font-size: 12px; }
  .trend { margin: 12px 0; padding: 10px 12px; border-radius: 12px; background: var(--card); font-weight: 600; }
  .trend.up { color: var(--up); } .trend.down { color: var(--down); }
  .chart { position: relative; }
  .chart svg { width:100%; height:auto; }
  .scroll {overflow-x:auto;}
  .legend {display:flex;gap:12px;flex-wrap:wrap;font-size:12px;}
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 7px 4px; border-bottom: 1px solid var(--card); vertical-align: top; }
  td.n { width: 32px; color: var(--muted); }
  td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.me td { font-weight: 700; color: var(--accent); }
  .muted { color: var(--muted); }
  .err { padding: 16px; border-radius: 12px; background: var(--card); }
</style>
</head>
<body>
<h1 id="title">Natijalarim</h1>
<div class="tabs"><button data-exam="ielts" class="on">🇬🇧 IELTS</button><button data-exam="cefr">🇪🇺 CEFR</button></div>
<button id="refresh" type="button" style="padding:8px 14px;margin-bottom:12px">↻ Yangilash</button>
<div id="app" aria-live="polite"><p class="muted">Yuklanmoqda…</p></div>

<script src="./app.js"></script>
</body>
</html>
